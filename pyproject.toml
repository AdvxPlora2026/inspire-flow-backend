[project]
name = "inspire-flow-backend"
version = "0.1.0"
description = "A layered FastAPI backend managed with uv"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.139.2",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
