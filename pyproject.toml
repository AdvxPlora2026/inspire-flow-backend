[project]
name = "inspire-flow-backend"
version = "0.1.0"
description = "A layered FastAPI backend managed with uv"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18,<2",
    "celery[redis]>=5.6,<6",
    "cryptography>=49,<50",
    "fastapi>=0.139.2",
    "httpx>=0.28,<1",
    "openai-agents>=0.18.3",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
stt = [
    "funasr>=1.3.27,<1.4",
    "huggingface-hub>=0.34,<2",
    "modelscope>=1.38,<2",
    "soundfile>=0.13,<1",
    "torch==2.11.*",
    "torchaudio==2.11.*",
]
